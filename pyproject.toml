[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentos"
version = "0.0.1"
description = "AgenticOS Phase-0 skeleton: gateway + durable Temporal execution (demo engine)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "temporalio>=1.30",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.19",
  "redis>=5",
  "PyYAML>=6",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["packages/contracts", "packages/db", "packages/events", "services/gateway", "services/orchestrator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
